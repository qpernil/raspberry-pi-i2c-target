[package]
name = "raspberry-i2c-link"
version = "0.1.0"
edition = "2021"
description = "Raspberry Pi I2C target driver tools and controller examples"
license = "MIT OR Apache-2.0"
repository = "https://github.com/qpernil/raspberry-pi-i2c-target"
readme = "README.md"
keywords = ["raspberry-pi", "i2c", "embedded-linux"]
categories = ["embedded", "hardware-support"]
publish = false

# Deliberately crate-dependency-free. Linux interfaces and system SDL2 are
# called directly; only virtual-display needs SDL2 at link/runtime.

[[bin]]
name = "controller"
path = "src/bin/controller.rs"

[[bin]]
name = "target"
path = "src/bin/target.rs"

[[bin]]
name = "target-driver"
path = "src/bin/target-driver.rs"

[[bin]]
name = "virtual-display"
path = "src/bin/virtual-display.rs"

[[bin]]
name = "controller-long"
path = "src/bin/controller-long.rs"
