name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-and-overlays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install --yes device-tree-compiler libsdl2-dev
      - name: Install Rust components
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Select Rust stable
        run: rustup default stable
      - name: Check formatting
        run: cargo fmt --check
      - name: Test
        env:
          SDL_VIDEODRIVER: dummy
        run: cargo test --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test transmit state machine
        run: python3 tests/tx_serializer.py
      - name: Test scope export framing
        run: python3 -m unittest discover -s tests -p 'test_siglent_capture.py'
      - name: Build receive-only diagnostic controller
        run: make -C diagnostics/receive-only controller
      - name: Verify pad-control bit preservation
        run: python3 diagnostics/receive-only/pad-control.py --self-test
      - name: Verify RP1 pad-control bit preservation
        run: python3 diagnostics/receive-only/rp1-pad-control.py --self-test
      - name: Verify captured-failure replay vector
        run: |
          python3 - <<'PYVECTORS'
          import hashlib, runpy
          frames = list(runpy.run_path("diagnostics/receive-only/generate-vectors.py")["frames"](2000))
          assert len(frames[12]) == 4096
          assert hashlib.sha256(frames[12]).hexdigest() == "e1996f7d4b243030f9a0e9c080940e7a45e74296f4e8cc1a71251d0fad3337d9"
          assert sum(map(len, frames)) < 32 * 1024 * 1024
          PYVECTORS
      - name: Compile overlays
        run: make -C kernel overlays

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install --yes libsdl2-dev
      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@1.95.0
      - name: Check minimum supported Rust version
        run: cargo check --locked --all-targets
